# Render Blueprint: one free web service running the Fastify API, which also serves the built web app.
# Free instances sleep when idle and have no persistent disk, so saved investigations reset on restart;
# the built-in demo needs neither GitHub nor Gemma and always works.
services:
  - type: web
    name: code-zero
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: 0.0.0.0
      - key: WEB_DIST_PATH
        value: apps/web/dist
      - key: PUBLIC_DEMO
        value: "true"
      # No GEMINI_API_KEY: the demo uses its labeled PRERECORDED analysis.
      - key: AI_PROVIDER
        value: gemini
      # Optional: a read-only token lifts GitHub imports from 60 to 5,000 requests/hour (shared by all visitors).
      - key: GITHUB_TOKEN
        sync: false
